name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Vérifier le style avec Ruff
        run: ruff check .

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Exécuter les tests et générer le rapport JUnit
        run: pytest --junitxml="test-results-${{ matrix.python-version }}.xml"
      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 7

  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les résultats requis
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            echo "CI failed: lint=$LINT_RESULT, test=$TEST_RESULT" >&2
            exit 1
          fi
          echo "CI passed: lint and all Python test versions succeeded."
